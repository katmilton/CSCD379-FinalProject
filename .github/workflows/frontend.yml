name: Deploy Frontend to Azure Static Web Apps

on:
  push:
    branches:
      - main
    paths:
      - 'NextQuest/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Frontend
    steps:
      - uses: actions/checkout@v4

      - name: Build And Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ICY_PLANT_0A2895310 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: "NextQuest"
          api_location: ""
          output_location: ".output/public"
          app_build_command: "npm ci && npx nuxi generate"
        env:
          NUXT_PUBLIC_API_BASE_URL: https://nextquest.azurewebsites.net
