name: Deploy Frontend to Azure Static Web Apps

on:
  push:
    branches:
      - main
    paths:
      - 'NextQuest/**'
      - '.github/workflows/frontend.yml'

jobs:
  build_and_deploy_job:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        working-directory: NextQuest
        run: npm ci

      - name: Generate static Nuxt site
        working-directory: NextQuest
        run: npx nuxi generate
        env:
          NUXT_PUBLIC_API_BASE_URL: https://nextquest.azurewebsites.net

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ICY_PLANT_0A2895310 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: "NextQuest/.output/public"
          api_location: ""
          output_location: ""
          skip_app_build: true